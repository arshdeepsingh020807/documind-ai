<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Upload a document and ask questions about it. Answers cite the passages they came from." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DocuMind</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong palette.
      try {
        var t = localStorage.getItem('documind:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
